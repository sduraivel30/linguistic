[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linguistic"
version = "0.1.0"
description = "Extract linguistic metrics for sentence and nonword stimulus lists"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "nltk",
    "typer",
    "python-BLICK==0.2.12",
]

[project.optional-dependencies]
dev = ["pytest"]
lm = ["torch", "transformers", "huggingface_hub"]

[project.scripts]
linguistic = "linguistic.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
